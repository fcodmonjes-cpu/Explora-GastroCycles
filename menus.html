<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Menús · ATA Tools</title>
<!-- Menús imprimibles de ATA Tools (2026-11). Página aparte de index.html a
     propósito: es una herramienta de PC/supervisor y no tiene por qué pesarle
     a cada garzón en cada actualización de la app. Ver ARCHITECTURE.md §3.10.

     Mismo patrón que las notas de check-out de ata-tools: UNA plantilla dibuja
     la vista previa y el PDF (lo que se ve es lo que se imprime), lo que falta
     va en rojo, "Editar a mano" sobre el papel para lo que los slots no cubren,
     y se mide a tamaño real si el menú cabe en su media hoja. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
/* ── Objektiv Mk1: la de los menús de Explora. Subconjunto latino (~108 KB los 6
      pesos); sólo se descarga en esta página. ── */
@font-face{font-family:Objektiv;src:url(assets/fuentes/objektiv-Lt.woff) format("woff");font-weight:300;font-style:normal}
@font-face{font-family:Objektiv;src:url(assets/fuentes/objektiv-LtIt.woff) format("woff");font-weight:300;font-style:italic}
@font-face{font-family:Objektiv;src:url(assets/fuentes/objektiv-Rg.woff) format("woff");font-weight:400;font-style:normal}
@font-face{font-family:Objektiv;src:url(assets/fuentes/objektiv-It.woff) format("woff");font-weight:400;font-style:italic}
@font-face{font-family:Objektiv;src:url(assets/fuentes/objektiv-Md.woff) format("woff");font-weight:500;font-style:normal}
@font-face{font-family:Objektiv;src:url(assets/fuentes/objektiv-Bd.woff) format("woff");font-weight:700;font-style:normal}

/* ── El papel: media carta horizontal = 5.5in × 8.5in = 396 × 612 pt. Todas las
      medidas en pt, tomadas de los PDF de diseño (ver TIPOS). ── */
.hoja{width:792pt;height:612pt;display:flex;background:#fff;overflow:hidden}
.menu{position:relative;width:396pt;height:612pt;flex:none;overflow:hidden;background:#fff;color:#000;
  font-family:Objektiv,sans-serif;font-kerning:normal;font-synthesis:none;-webkit-font-smoothing:antialiased}
.menu .abs{position:absolute;left:42.5pt;white-space:nowrap}
.menu .tit{font-size:12pt;line-height:12pt;letter-spacing:4pt;text-transform:uppercase}
.menu .logo{position:absolute}
.menu .logo svg{display:block;width:100%;height:100%}
.menu .cuerpo{position:absolute;left:42.5pt;width:312pt;outline:none}
.menu .sec{position:relative;font-weight:500;text-transform:uppercase}
.menu .sec::after{content:"";position:absolute;left:0;top:var(--regla);width:var(--rw);border-top:.45pt solid #000}
.menu .es{font-weight:700}
.menu .en{font-style:italic}
.menu .opc{font-weight:400}
.menu .ics{white-space:nowrap}
/* margen superior negativo: el ícono (9,8 pt) es más alto que la caja del renglón y si no lo empuja 1,3 pt */
.menu .ics svg{display:inline-block;vertical-align:baseline;margin:-6pt 0 0 2.6pt;overflow:visible}
.menu .ics svg:first-child{margin-left:4.6pt}
.menu .filete{position:absolute;left:42.7pt;border-top:.5pt solid #000}
.menu .ley{position:absolute;left:0;display:flex}
.menu .ley .c{display:flex;flex-direction:column;align-items:center;flex:none}
.menu .ley svg{display:block}
.menu .ley span{font-weight:400;white-space:nowrap;position:absolute}
.menu .falta{background:#ffd9d4;color:#a8231a;border-radius:1pt;padding:0 1pt}
.menu.desborda{box-shadow:inset 0 0 0 2pt #d8452f}

@page{size:11in 8.5in;margin:0}

/* ── La herramienta: paleta de ATA Tools (dark amber), sin colores nuevos. ── */
:root{--bg:#1a1917;--bg2:#242220;--sup:#2a2825;--bd:rgba(255,255,255,.1);--bd2:rgba(255,255,255,.18);
  --tx:#f0eeea;--tx2:#aaa;--tx3:#777;--oro:#BA7517;--oro-bg:#3a2a05;--coral:#D85A30;--coral-bg:#3a1a0a}
html{color-scheme:dark;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
.serif{font-family:"Cormorant Garamond",Georgia,serif}
.mono{font-family:"Courier Prime",ui-monospace,monospace}
button,input,select{font:inherit;color:inherit}
button{border:1px solid var(--bd2);background:var(--sup);border-radius:7px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--tx3)}
button.prim{background:var(--oro);border-color:var(--oro);color:#1a1917;font-weight:600}
button.chico{padding:2px 8px;font-size:12px}
button.ghost{background:none;border-color:transparent;color:var(--tx2)}
button.ghost:hover{color:var(--tx);border-color:var(--bd2)}
button:disabled{opacity:.45;cursor:default}
/* 16px como en la app: por debajo de eso iOS hace zoom al enfocar y descuadra la pantalla. */
input[type=text],input[type=search],textarea{resize:vertical;font:inherit;font-size:16px;background:var(--bg2);border:1px solid var(--bd2);border-radius:7px;padding:6px 9px;min-width:0}
input:focus,textarea:focus{outline:none;border-color:var(--oro)}

header.app{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--bd);
  padding:10px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.marca{font-size:22px;font-style:italic;color:#c9a27a;margin-right:4px;text-decoration:none}
.marca b{font-family:"Courier Prime",monospace;font-style:normal;font-weight:400;font-size:13px;letter-spacing:.18em;color:var(--tx2);margin-left:6px}
.buscador{position:relative;flex:1;min-width:220px;max-width:460px}
.buscador input{width:100%;box-sizing:border-box}
.esp{flex:1}
#estado{color:var(--tx3);font-size:12px;min-width:70px;text-align:right}
#estado.error{color:var(--coral)}

.res{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--bg2);border:1px solid var(--bd2);border-radius:9px;
  max-height:min(60vh,420px);overflow:auto;z-index:30;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.res[hidden]{display:none}
.res button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--bd);border-radius:0;background:none;padding:7px 11px}
.res button:last-child{border-bottom:0}
.res button:hover,.res button.sel{background:var(--sup)}
.res .n{display:block}
.res .t{display:block;color:var(--tx2);font-size:12px;font-style:italic}
.res .d{float:right;color:var(--tx3);font-size:11px;font-family:"Courier Prime",monospace;margin-left:8px}
.res .vacio{padding:10px 12px;color:var(--tx3);font-size:13px}
.res .libre{color:#c9a27a}
mark{background:none;color:#e0b070;font-weight:600}

nav.sel{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 18px 0;max-width:1320px;margin:0 auto}
.seg{display:flex;border:1px solid var(--bd2);border-radius:9px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;border-radius:0;background:none;padding:7px 13px;font-family:"Courier Prime",monospace;font-size:13px;letter-spacing:.04em;color:var(--tx2)}
.seg button+button{border-left:1px solid var(--bd)}
.seg button.on{background:var(--oro-bg);color:#e8c48e}
.seg button .hoy{font-size:10px;color:var(--oro);margin-left:5px;letter-spacing:.06em}
.seg button .mod{color:var(--oro);margin-left:3px}
.dias[hidden]{display:none}

main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;padding:14px 18px 80px;max-width:1320px;margin:0 auto;align-items:start}
.slots{min-width:0}
.pag-cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.pag-cab h2{margin:0;font-size:26px;font-weight:500}
.pag-cab .sub{color:var(--tx3);font-size:12px}
.aviso{border-left:2px solid var(--coral);background:var(--coral-bg);color:#f3b49e;padding:7px 11px;border-radius:0 7px 7px 0;font-size:13px;margin:0 0 10px}
.aviso.oro{border-color:var(--oro);background:var(--oro-bg);color:#e8c48e}
.aviso[hidden]{display:none}
.aviso button{margin-left:6px}
.seccion-t{font-family:"Courier Prime",monospace;font-size:12px;letter-spacing:.14em;color:var(--tx3);text-transform:uppercase;
  margin:16px 0 6px;display:flex;align-items:center;gap:8px}
.seccion-t::after{content:"";flex:1;border-top:1px solid var(--bd)}

.slot{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;margin-bottom:7px}
.slot.cambio{border-color:rgba(186,117,23,.55)}
.slot.vacio{border-style:dashed}
.slot .fila{display:flex;align-items:center;gap:10px;padding:8px 10px}
.slot .num{font-family:"Courier Prime",monospace;color:var(--tx3);font-size:12px;width:16px;text-align:right;flex:none}
.slot .txt{flex:1;min-width:0;cursor:pointer;padding:2px 0}
.slot .txt .n{font-weight:600}
.slot .txt .t{color:var(--tx2);font-style:italic;font-size:13px}
.slot .txt .o{color:var(--tx3);font-size:12px}
.slot .txt .ori{color:#c9a27a;font-size:12px}
.slot .rojo{color:#f0877c;font-style:normal}
.ics-ed{display:flex;gap:3px;flex:none}
.ics-ed button{width:28px;height:28px;padding:0;display:grid;place-items:center;border-radius:6px;background:none;border-color:transparent;color:var(--tx3);opacity:.45}
.ics-ed button svg{height:15px;width:auto;max-width:18px}
.ics-ed button:hover{opacity:.8;border-color:var(--bd2)}
.ics-ed button.on{opacity:1;color:#f0eeea;background:var(--sup);border-color:var(--bd2)}
.slot .ed{padding:2px 12px 12px 36px;display:grid;gap:8px}
.slot .ed[hidden]{display:none}
.slot .ed .busca{position:relative}
.slot .ed .busca input{width:100%;box-sizing:border-box}
.slot .ed .busca .res{position:static;margin-top:4px;box-shadow:none;max-height:260px}
.slot .ed label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--tx3)}
.slot .ed .dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot .ed .acc{display:flex;gap:6px;flex-wrap:wrap}
.agregar{margin:2px 0 4px}

.lado{position:sticky;top:64px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.papel{width:calc(396pt*var(--k));height:calc(612pt*var(--k));box-shadow:0 2px 18px rgba(0,0,0,.55);border-radius:2px;overflow:hidden;background:#fff}
.papel .menu{transform:scale(var(--k));transform-origin:0 0}
.papel .menu.manual .cuerpo{box-shadow:0 0 0 1.5pt #e9b949}
.lado .acc{display:flex;gap:8px;flex-wrap:wrap}
.lado .txtpie{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--tx3);width:calc(396pt*var(--k))}

/* Modal de impresión */
dialog{background:var(--bg2);color:var(--tx);border:1px solid var(--bd2);border-radius:12px;padding:0;width:min(560px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog .cab{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
dialog h3{margin:0;font-size:22px;font-weight:500}
dialog .cuerpo-d{padding:12px 18px;display:grid;gap:10px;max-height:62vh;overflow:auto}
dialog .grupo{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
dialog .grupo .g{width:84px;font-family:"Courier Prime",monospace;font-size:13px;color:var(--tx2)}
dialog .chk{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--bd2);border-radius:7px;padding:4px 9px;cursor:pointer;font-size:13px}
dialog .chk.on{background:var(--oro-bg);border-color:var(--oro);color:#e8c48e}
dialog .chk.mal{border-color:var(--coral)}
dialog .chk input{display:none}
dialog .pie-d{padding:12px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
dialog .nota{color:var(--tx3);font-size:12px}

#impresion{display:none}
@media print{
  html,body{background:#fff !important}
  body>*:not(#impresion){display:none !important}
  #impresion{display:block}
  #impresion .hoja{break-after:page}
  #impresion .falta{background:none;color:inherit;padding:0}
  #impresion .menu.desborda{box-shadow:none}
}
@media (max-width:980px){
  main{grid-template-columns:1fr}
  .lado{position:static;order:-1;align-items:center;width:100%}
  header.app{position:static}
}
@media (max-width:560px){
  .seg button{padding:7px 10px}
  .ics-ed button{width:24px;height:24px}
  .slot .ed{padding-left:12px}
  .slot .ed .dos{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="app">
  <a class="marca serif" href="/" title="Volver a ATA Tools">ATA<b>MENÚS</b></a>
  <div class="buscador">
    <input id="q" type="search" placeholder="Buscar plato en todos los menús…" autocomplete="off" spellcheck="false">
    <div class="res" id="q-res" hidden></div>
  </div>
  <span class="esp"></span>
  <span id="estado"></span>
  <button class="ghost chico" id="b-respaldo" title="Descarga un .json con todos los cambios">Respaldo</button>
  <button class="ghost chico" id="b-importar" title="Carga un respaldo .json">Importar</button>
  <input type="file" id="f-importar" accept=".json,application/json" hidden>
  <button class="prim" id="b-pdf">Imprimir PDF</button>
</header>
<nav class="sel">
  <div class="seg" id="seg-tipo"></div>
  <div class="seg dias" id="seg-dia"></div>
</nav>
<main>
  <section class="slots" id="slots"></section>
  <aside class="lado" id="lado"></aside>
</main>
<dialog id="dlg-pdf">
  <div class="cab"><h3 class="serif">Imprimir</h3><span class="esp"></span><button class="ghost chico" id="dlg-cerrar">✕</button></div>
  <div class="cuerpo-d" id="dlg-cuerpo"></div>
  <div class="pie-d">
    <button class="chico" id="dlg-hoy"></button>
    <button class="chico ghost" id="dlg-nada">Ninguno</button>
    <span class="esp"></span>
    <button class="prim" id="dlg-ok">Imprimir</button>
  </div>
  <div class="pie-d" style="border-top:0;padding-top:0"><span class="nota">Cada menú sale dos veces por hoja, carta horizontal, como los originales. En el diálogo del navegador: destino «Guardar como PDF», márgenes «Ninguno», escala 100 %.</span></div>
</dialog>
<div id="impresion"></div>
<script>
"use strict";
// Si este aparato nunca pasó el gate de ATA Tools, vuelve a la portada. Es una
// puerta blanda (los menús no son secretos); evita que la URL suelta sirva de entrada.
try {
  const local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || location.protocol === "file:";
  if (!local && localStorage.getItem("ata.gate.v1") !== "1") location.replace("/");
} catch (e) {}

// ═══════════════════════════════════════════════════════════════════════════════
// DATOS BASE — cena, postres de cena, almuerzo y postres de almuerzo salen a máquina
// del catálogo de la app (DISHES + DISH_TRANS de index.html, 2026-11-11): nombre en
// oración, inglés de la ficha y orden de la carta impresa. Los íconos son la MATRIZ
// de la app: ✗ o ✓* en un eje = "contiene" (gluten por GE, el estricto); un eje sin
// dato conserva el ícono del PDF (pasa en el bar). Bar y desayuno, del diseño:
// (origen, 2026-11-10) transcritos a máquina de los PDF de diseño:
//   Menu Cena / Almuerzo / Postres Almuerzo / Bar ATA 2026.pdf  y  DESAYUNO-A (Word).
// Texto y posición de cada ícono salen del PDF: cada ícono se asignó al plato cuya
// línea cruza (0 inferencias). Correcciones: "Orange"→"orange", "menu"→"menú",
// "Champiñon"→"Champiñón". El desayuno no traía diseño: se pasa al de la carta.
// ═══════════════════════════════════════════════════════════════════════════════

function indice() {

    const k = norm(c.es) + "|" + norm(c.des_es || "");

    if (donde && !vistos.get(k).donde.includes(donde)) vistos.get(k).donde.push(donde);
  };

function rotulo(t, d) { return TIPOS[t].dias > 1 ? `${TIPOS[t].nombre} D${d}` : TIPOS[t].nombre; }
function buscar(q, lista) {

  const out = [];
  for (const e of lista) {
    const h = norm([e.it.es, e.it.en, e.it.des_es, e.it.des_en].join(" "));

    const n = norm(e.it.es);

function Flujo() {
  // Bloques apilados por línea de base: cada uno dice a cuánto queda su primera
  // línea de base de la última del bloque anterior, y el margen sale de ahí.
  const partes = []; let prev = null, top = 0;
  return {
    add(html, fs, L, dy, cls, style = "") {
      let mt = 0;
      if (!prev) top = dy - bOf(L, fs);           // primer bloque: dy = base absoluta
      else mt = dy - (prev.L - bOf(prev.L, prev.fs)) - bOf(L, fs);
      partes.push(`<div class="${cls}" style="margin-top:${mt.toFixed(2)}pt;font-size:${fs}pt;line-height:${L}pt;${style}">${html}</div>`);
      prev = {fs, L};
    },
    get top() { return top; }, get html() { return partes.join(""); }, get vacio() { return !prev; },
  };
}

    if (S) {
      const C = T.sec, L = C.fs;
      const style = `letter-spacing:${C.ls};${C.ws ? "word-spacing:" + C.ws + ";" : ""}font-weight:${C.w};--regla:${(bOf(L, C.fs) + pick(C.regla, s)).toFixed(2)}pt;--rw:${pick(C.rw, s)}pt`;
      f.add(`${esc(S.es)} / ${esc(S.en)}`, C.fs, L, primeroSec ? C.base : C.tras, "sec", style);
      primeroSec = false;
    }
    items.forEach((it, i) => {
      const dy = i === 0 ? (S ? pick(T.sec.primero, s) : T.primero) : P.gap;
      if (T.desayuno) {
        const C = P.cab;
        // Título largo: corta después de la barra (como el Word original), no a mitad de frase.
        const sep = plano(it.es).length + plano(it.en).length > 50 ? " /<br>" : " / ";
        f.add(`${br(it.es) || falta("Título")}${it.en ? sep + br(it.en) : ""}${icsHtml(it.ic, C.fs)}`, C.fs, P.L, dy, "sec", `font-weight:${C.w};letter-spacing:${C.ls};text-transform:uppercase`);
        if ((it.des_es || "").trim()) f.add(br(it.des_es), P.fs, P.L, P.dyEs, "opc");
        if ((it.des_en || "").trim()) f.add(br(it.des_en), P.fs, P.Len, it.des_es ? P.en : P.dyEs, "en");
      } else {
        const trk = P.ls ? `letter-spacing:${P.ls}` : "";   // medido contra el PDF, glifo a glifo
        f.add(`${br(it.es) || falta("Nombre")}${icsHtml(it.ic, P.fs)}`, P.fs, P.L, dy, "es", trk);
        f.add(br(it.en) || falta("English"), P.fs, P.Len, P.en, "en", trk);
      }
    });
  });
  const pie = pieDe(t);
  if (T.pie && pie.trim()) {
    const C = T.pie;
    f.add(esc(pie), C.fs, C.fs * 1.3, f.vacio ? 300 : C.dy, "pie", `font-weight:${C.w};${C.it ? "font-style:italic;" : ""}letter-spacing:${C.ls}`);
  }
  return {top: f.top, html: f.html};
}

function leyendaHtml(t, d) {
  const T = TIPOS[t], Y = T.ley;
  // La leyenda lleva los íconos del tipo y además cualquiera que se use en la página:
  // un ícono en un plato nunca queda sin explicar.
  const usados = new Set(Y.set);
  T.secs.forEach((_, s) => secActual(t, d, s).forEach(it => (it.ic || []).forEach(k => usados.add(k))));
  const set = IC.filter(k => usados.has(k));
  if (!set.length) return "";
  const lb = bOf(Y.fs, Y.fs), C = Y.centros, paso = (C[C.length - 1] - C[0]) / Math.max(1, C.length - 1);
  // Columnas centradas en las posiciones del PDF; si la página usa más íconos que
  // los de su leyenda, las que sobran siguen con el mismo paso.
  return `<div class="ley" style="top:${Y.top}pt;color:${Y.color}">${set.map((k, i) => {
    const cx = C[i] ?? C[C.length - 1] + paso * (i - C.length + 1), w = 44;
    return `<div class="c" style="position:absolute;left:${(cx - w / 2).toFixed(2)}pt;width:${w}pt">${svgIc(k, SVG[k].vb[3] * Y.esc)}<span style="font-size:${Y.fs}pt;line-height:${Y.fs}pt;top:${(Y.base - Y.top - lb).toFixed(2)}pt">${esc(IC_NOM[k])}</span></div>`;
  }).join("")}</div>`;
}

function menuHtml(t, d, opts = {}) {
  const T = TIPOS[t], b12 = bOf(12, 12);
  // Tracking del título: 4 pt en cena y postres; el almuerzo y el bar lo traen distinto (medido glifo a glifo).
  const trk = (i = 0) => (T.titLs ? `letter-spacing:${pick(T.titLs, i)};` : "") + (T.titWs ? `word-spacing:${T.titWs};` : "");
  const titulo = T.unaLinea
    ? `<div class="abs tit" style="top:${(T.titulo[0] - b12).toFixed(2)}pt;${trk()}"><span style="font-weight:500">${esc(T.es)}</span><span style="font-style:italic;font-weight:400;margin-left:${pick(T.titLs, 0)}"> /${esc(T.en)}</span></div>`
    : `<div class="abs tit" style="top:${(T.titulo[0] - b12).toFixed(2)}pt;font-weight:500;${trk(0)}">${esc(T.es)}</div>
       <div class="abs tit" style="top:${(T.titulo[1] - b12).toFixed(2)}pt;font-weight:300;${trk(1)}">${esc(T.en)}</div>`;
  const L = SVG.logo, lg = T.logo;
  const logo = `<div class="logo" style="left:${lg.x}pt;top:${lg.y}pt;width:${lg.l}pt;height:${lg.l}pt;color:#231f20"><svg viewBox="${L.vb.join(" ")}" fill="currentColor" aria-label="explora">${L.p}</svg></div>`;
  const filete = T.filete ? `<div class="filete" style="top:${T.filete.y}pt;width:${T.filete.w}pt"></div>` : "";
  const man = estado.manual[t + "|" + d];
  const c = cuerpoHtml(t, d);
  const cuerpo = `<div class="cuerpo" style="top:${c.top.toFixed(2)}pt">${man != null ? sanear(man) : c.html}</div>`;
  return `<div class="menu${man != null ? " manual" : ""}" data-p="${t}|${d}">${logo}${titulo}${filete}${cuerpo}${leyendaHtml(t, d)}</div>`;
}

// HTML escrito a mano: sólo texto con formato; nada de scripts ni atributos de evento.
function sanear(html) {
  const doc = new DOMParser().parseFromString(`<div>${html}</div>`, "text/html");
  doc.querySelectorAll("script,style,iframe,object,embed,link,meta").forEach(n => n.remove());
  doc.querySelectorAll("*").forEach(n => [...n.attributes].forEach(a => { if (/^on/i.test(a.name) || /javascript:/i.test(a.value)) n.removeAttribute(a.name); }));
  return doc.body.firstChild.innerHTML;
}

// ¿Cabe? Se mide la página a tamaño real fuera de pantalla: el cuerpo no puede
// pisar la leyenda (ni el borde de la hoja si no hay leyenda).
const medidor = document.createElement("div");
medidor.style.cssText = "position:fixed;left:-10000px;top:0;visibility:hidden;pointer-events:none";
document.body.appendChild(medidor);
function desborda(t, d) {
  medidor.innerHTML = menuHtml(t, d);
  const m = medidor.firstElementChild, c = m.querySelector(".cuerpo"), ley = m.querySelector(".ley");
  const r0 = m.getBoundingClientRect(), rc = c.getBoundingClientRect();
  const limite = ley ? ley.getBoundingClientRect().top - 4 : r0.bottom - 20;
  // Ancho: un nombre largo sin espacios podría salirse del margen derecho.
  const ancho = [...c.querySelectorAll("div")].some(x => x.scrollWidth > c.clientWidth + 1);
  return rc.bottom > limite + 0.5 || ancho;
}

function dibujarTodo() { dibujarSelectores(); dibujarSlots(); dibujarLado(); }

function dibujarSlots() {
  const t = vista.tipo, d = vista.dia, T = TIPOS[t];
  const man = estado.manual[t + "|" + d] != null;
  const n = cambiosPagina(t, d);

    <p class="aviso" id="av-largo" hidden>No cabe en la media hoja: acorta un texto o quita un plato.</p>
    ${man ? `<p class="aviso oro">✎ Esta página tiene texto escrito a mano: los slots ya no la cambian.<button class="chico" data-a="volver-plantilla">Volver a los slots</button></p>` : ""}`;
  T.secs.forEach((S, s) => {

function slotHtml(t, d, s, i, it, orig) {
  const k = `${s}.${i}`, T = TIPOS[t], abierto = vista.abierto === k;
  const cambiado = !igual(it, orig);
  const vacio = !(it.es || "").trim();
  const ori = cambiado && orig ? `<div class="ori">original: ${esc(plano(orig.es))}</div>` : cambiado && !orig ? `<div class="ori">agregado</div>` : "";
  const ics = IC.map(x => `<button class="${(it.ic || []).includes(x) ? "on" : ""}" data-a="ic" data-ic="${x}" title="${IC_NOM[x]}">${svgIc(x, 14)}</button>`).join("");

        ${T.desayuno ? (it.des_es ? `<div class="o">${esc(plano(it.des_es))}</div>` : "") : `<div class="t">${it.en ? esc(plano(it.en)) : vacio ? "" : '<span class="rojo">falta el inglés</span>'}</div>`}
        ${ori}

    </div>

      <div class="busca"><input type="search" placeholder="Cambiar por… (busca en todos los menús)" autocomplete="off" spellcheck="false"><div class="res" hidden></div></div>
      <div class="dos">
        <label>${T.desayuno ? "Título (es)" : "Nombre (es)"}<textarea rows="2" data-f="es">${esc(it.es)}</textarea></label>
        <label>${T.desayuno ? "Título (en)" : "English"}<textarea rows="2" data-f="en">${esc(it.en)}</textarea></label>
        ${T.desayuno ? `<label>Opciones (es)<input type="text" data-f="des_es" value="${esc(it.des_es || "")}"></label>
        <label>Opciones (en)<input type="text" data-f="des_en" value="${esc(it.des_en || "")}"></label>` : ""}
      </div>

        <span class="esp"></span>

}

// Edición en sitio: cambiar un campo no redibuja la lista (el foco y el scroll
// no se mueven); sólo se parchan la ficha y el papel.
function editarSlot(s, i, fn, redibujar = false) {
  const t = vista.tipo, d = vista.dia;
  const lista = clon(secActual(t, d, s));
  fn(lista);
  secEscribir(t, d, s, lista);
  if (redibujar) { dibujarSlots(); dibujarSelectores(); }
  else parcharSlot(s, i);
  dibujarPapel();
}
function parcharSlot(s, i) {
  const t = vista.tipo, d = vista.dia, el = document.querySelector(`.slot[data-s="${s}"][data-i="${i}"]`);
  if (!el) return;
  const it = secActual(t, d, s)[i], orig = baseSec(t, d, s)[i];
  const tmp = document.createElement("div"); tmp.innerHTML = slotHtml(t, d, s, i, it, orig);
  const nuevo = tmp.firstElementChild;
  el.className = nuevo.className;
  el.querySelector(".fila").replaceWith(nuevo.querySelector(".fila"));
  const accV = el.querySelector(".acc"), accN = nuevo.querySelector(".acc");
  if (accV && accN) accV.replaceWith(accN);
  dibujarSelectores();
  const sub = document.querySelector(".pag-cab .sub"), n = cambiosPagina(t, d);
  if (sub) sub.textContent = `${d === hoyDe(t) && TIPOS[t].dias > 1 ? "hoy · " : ""}${n ? n + (n === 1 ? " cambio" : " cambios") : "como el original"}`;
}

$("slots").addEventListener("click", e => {
  const a = e.target.closest("[data-a]"); if (!a) return;
  const slot = a.closest(".slot"), s = slot ? +slot.dataset.s : +a.dataset.s, i = slot ? +slot.dataset.i : -1;
  const t = vista.tipo, d = vista.dia;
  switch (a.dataset.a) {
    case "abrir": {
      const ed = slot.querySelector(".ed"), abrir = ed.hidden;
      document.querySelectorAll(".slot .ed").forEach(x => x.hidden = true);
      ed.hidden = !abrir; vista.abierto = abrir ? slot.dataset.k : null;
      if (abrir) ed.querySelector(".busca input").focus();
      break;
    }
    case "cerrar": slot.querySelector(".ed").hidden = true; vista.abierto = null; break;
    case "ic": editarSlot(s, i, l => { const ic = new Set(l[i].ic || []); ic.has(a.dataset.ic) ? ic.delete(a.dataset.ic) : ic.add(a.dataset.ic); l[i].ic = [...ic]; }); break;
    case "subir": if (i > 0) { vista.abierto = `${s}.${i - 1}`; editarSlot(s, i, l => l.splice(i - 1, 0, l.splice(i, 1)[0]), true); } break;
    case "bajar": {
      const n = secActual(t, d, s).length;
      if (i < n - 1) { vista.abierto = `${s}.${i + 1}`; editarSlot(s, i, l => l.splice(i + 1, 0, l.splice(i, 1)[0]), true); }
      break;
    }
    case "restaurar": editarSlot(s, i, l => { l[i] = clon(baseSec(t, d, s)[i]); }, true); break;
    case "quitar": vista.abierto = null; editarSlot(s, i, l => l.splice(i, 1), true); break;
    case "agregar": {
      const n = secActual(t, d, s).length;
      vista.abierto = `${s}.${n}`;
      editarSlot(s, n, l => l.push({es: "", en: ""}), true);
      document.querySelector(`.slot[data-k="${s}.${n}"] .busca input`)?.focus();
      break;
    }
    case "restaurar-pag":
      if (!confirm(`¿Volver ${TIPOS[t].nombre}${TIPOS[t].dias > 1 ? " día " + d : ""} al original? Se pierden sus cambios.`)) return;
      TIPOS[t].secs.forEach((_, s2) => delete estado.ov[claveSec(t, d, s2)]);
      delete estado.manual[t + "|" + d]; guardar(); dibujarTodo(); break;
    case "volver-plantilla":
      delete estado.manual[t + "|" + d]; guardar(); dibujarTodo(); break;
  }
});
$("slots").addEventListener("input", e => {
  const inp = e.target, slot = inp.closest(".slot"); if (!slot) return;
  const s = +slot.dataset.s, i = +slot.dataset.i;
  if (inp.dataset.f) {
    const f = inp.dataset.f;
    editarSlot(s, i, l => { l[i][f] = inp.value; });
  } else if (inp.closest(".busca")) {
    pintarResultados(inp.closest(".busca").querySelector(".res"), inp.value, true);
  }
});

// ── Resultados de búsqueda (en un slot: reemplazan el plato) ─────────────────────
let IDX = null;
function pintarResultados(cont, q, enSlot) {
  if (!q.trim()) { cont.hidden = true; cont.innerHTML = ""; return; }
  IDX = IDX || indice();
  const r = enSlot ? buscar(q, IDX) : buscarUbicaciones(q);
  let h;
  if (enSlot) {
    h = r.map((e, n) => `<button data-n="${n}" class="${n === 0 ? "sel" : ""}"><span class="d">${esc(e.donde.slice(0, 2).join(" · ") || "editado")}</span>
      <span class="n">${resaltar(plano(e.it.es), q)} ${icsMini(e.it.ic)}</span><span class="t">${esc(plano(e.it.en || e.it.des_es || ""))}</span></button>`).join("");
    h += `<button data-libre="1" class="${r.length ? "" : "sel"}"><span class="n libre">✎ Usar «${esc(q.trim())}» como texto libre</span><span class="t">Para un plato que no está en ningún menú; el inglés se escribe abajo.</span></button>`;
    cont._r = r;
  } else {
    h = r.length ? r.map((e, n) => `<button data-n="${n}" class="${n === 0 ? "sel" : ""}"><span class="d">${esc(e.donde)}</span>
      <span class="n">${resaltar(plano(e.it.es), q)} ${icsMini(e.it.ic)}</span><span class="t">${esc(plano(e.it.en || ""))}</span></button>`).join("")
      : `<div class="vacio">No aparece en ningún menú de hoy. Para ponerlo, abre un slot y búscalo ahí.</div>`;
    cont._r = r;
  }
  cont.innerHTML = h; cont.hidden = false;
}
const icsMini = ic => (ic || []).length ? `<span style="color:var(--tx3);margin-left:4px">${ic.filter(x => SVG[x]).map(x => svgIc(x, 10)).join(" ")}</span>` : "";

$("slots").addEventListener("click", e => {
  const b = e.target.closest(".busca .res button"); if (!b) return;
  elegir(b.closest(".slot"), b);
});
function elegir(slot, b) {
  const s = +slot.dataset.s, i = +slot.dataset.i, cont = b.closest(".res"), inp = slot.querySelector(".busca input");
  if (b.dataset.libre) {
    const txt = inp.value.trim();
    editarSlot(s, i, l => { l[i] = {es: txt, en: "", ...(TIPOS[vista.tipo].desayuno ? {des_es: "", des_en: ""} : {})}; }, true);
    const el = document.querySelector(`.slot[data-s="${s}"][data-i="${i}"]`);
    el.querySelector(".ed").hidden = false; el.querySelector('[data-f="en"]').focus();
    vista.abierto = `${s}.${i}`;
    return;
  }
  const e = cont._r[+b.dataset.n];
  editarSlot(s, i, l => { l[i] = clon(e.it); }, true);
  vista.abierto = null;
  avisar(`Cambiado: ${e.it.es}`);
}
// Teclado en los buscadores: ↑↓ para moverse, Enter elige, Esc cierra.
document.addEventListener("keydown", e => {
  const inp = e.target; if (!(inp instanceof HTMLInputElement) || inp.type !== "search") return;
  const cont = inp.parentElement.querySelector(".res"); if (!cont) return;
  if (e.key === "Escape") { cont.hidden = true; if (inp.id === "q") inp.blur(); return; }
  if (cont.hidden) return;
  const bs = [...cont.querySelectorAll("button")]; let n = bs.findIndex(b => b.classList.contains("sel"));
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); bs[n]?.classList.remove("sel");
    n = Math.max(0, Math.min(bs.length - 1, n + (e.key === "ArrowDown" ? 1 : -1)));
    bs[n]?.classList.add("sel"); bs[n]?.scrollIntoView({block: "nearest"});
  } else if (e.key === "Enter" && bs[n]) {
    e.preventDefault();
    if (inp.id === "q") irA(cont._r[+bs[n].dataset.n]); else elegir(inp.closest(".slot"), bs[n]);
  }
});

// ── Buscador global: ¿dónde está este plato HOY (con los cambios)? ───────────────
function buscarUbicaciones(q) {
  const lista = [];
  for (const t of ORDEN_TIPOS) for (const d of diasDe(t)) TIPOS[t].secs.forEach((S, s) =>
    secActual(t, d, s).forEach((it, i) => { if (it.es) lista.push({it, donde: rotulo(t, d) + (S ? " · " + S.es.toLowerCase() : ""), t, d, k: `${s}.${i}`}); }));
  return buscar(q, lista.map(x => ({...x, donde: x.donde}))).map(r => r);
}
function irA(r) { $("q-res").hidden = true; $("q").value = ""; ir(r.t, r.d, r.k); }
$("q").addEventListener("input", e => pintarResultados($("q-res"), e.target.value, false));
$("q").addEventListener("focus", e => { if (e.target.value) pintarResultados($("q-res"), e.target.value, false); });
$("q-res").addEventListener("click", e => { const b = e.target.closest("button[data-n]"); if (b) irA($("q-res")._r[+b.dataset.n]); });
document.addEventListener("click", e => { if (!e.target.closest(".buscador")) $("q-res").hidden = true; });
document.addEventListener("keydown", e => {   // "/" salta al buscador global
  if (e.key === "/" && !/input|textarea/i.test(document.activeElement.tagName) && !document.activeElement.isContentEditable) { e.preventDefault(); $("q").focus(); }
});

// ── Columna del papel ──────────────────────────────────────────────────────────
function escalaPapel() { return window.innerWidth < 560 ? Math.min(1, (window.innerWidth - 36) / 528) : window.innerWidth < 980 ? 0.9 : 0.95; }
function dibujarLado() {
  const t = vista.tipo, d = vista.dia, T = TIPOS[t], man = estado.manual[t + "|" + d] != null;
  sinZoom(false);   // redibujar el lado siempre sale de la edición a mano
  $("lado").style.setProperty("--k", escalaPapel());
  $("lado").innerHTML = `<div class="papel" id="papel"></div>
    ${T.pie ? `<label class="txtpie">Pie (${esc(T.nombre)}, todos los días)<input type="text" id="in-pie" value="${esc(pieDe(t))}"></label>` : ""}
    <div class="acc"><button class="chico" id="b-mano">${man ? "Terminar edición a mano" : "✎ Editar a mano"}</button>
    <button class="chico ghost" id="b-solo">Imprimir sólo esta</button></div>`;
  dibujarPapel();
  $("b-mano").onclick = () => {
    const m = document.querySelector("#papel .menu"), c = m.querySelector(".cuerpo");
    if (c.isContentEditable) { c.contentEditable = false; sinZoom(false); dibujarTodo(); return; }
    sinZoom(true); c.contentEditable = true; m.classList.add("manual"); c.focus();
    $("b-mano").textContent = "Terminar edición a mano";
  };
  $("b-solo").onclick = () => imprimir([`${t}|${d}`]);
  $("in-pie")?.addEventListener("input", e => {
    const v = e.target.value;
    if (v === T.pie.txt) delete estado.pie[t]; else estado.pie[t] = v;
    guardar(); dibujarPapel();
  });
}
// El papel va en pt reales (9pt): no se puede subir a 16px sin romper la plantilla, así que
// mientras se edita a mano se fija la escala del viewport (iOS sigue dejando pellizcar).
function sinZoom(on) {
  const v = document.querySelector('meta[name="viewport"]');
  if (v) v.content = "width=device-width,initial-scale=1" + (on ? ",maximum-scale=1" : "");
}
function dibujarPapel() {
  const t = vista.tipo, d = vista.dia, p = $("papel"); if (!p) return;
  if (p.querySelector(".cuerpo")?.isContentEditable) return;   // no pisar lo que se está escribiendo
  p.innerHTML = menuHtml(t, d);
  const largo = desborda(t, d);
  p.firstElementChild.classList.toggle("desborda", largo);
  const av = $("av-largo"); if (av) av.hidden = !largo;
  const c = p.querySelector(".cuerpo");
  c.addEventListener("input", () => {
    estado.manual[t + "|" + d] = c.innerHTML; guardar();
    if (!document.querySelector(".aviso.oro")) dibujarSlots();
  });
  IDX = null;
}
window.addEventListener("resize", () => $("lado")?.style.setProperty("--k", escalaPapel()));

// ── Imprimir ───────────────────────────────────────────────────────────────────
function paginas() { const o = []; for (const t of ORDEN_TIPOS) for (const d of diasDe(t)) o.push(`${t}|${d}`); return o; }
function abrirDialogo() {
  const deHoy = () => new Set([`cena|${HOY_CENA}`, `postresCena|${HOY_CENA}`, `almuerzo|${HOY_ALM}`, `postres|${HOY_ALM}`]);
  let sel = estado.imprimir ? new Set(estado.imprimir) : deHoy();
  const pintar = () => {
    $("dlg-cuerpo").innerHTML = ORDEN_TIPOS.map(t => `<div class="grupo"><span class="g">${TIPOS[t].nombre}</span>${diasDe(t).map(d => {
      const k = `${t}|${d}`, mal = desborda(t, d), n = cambiosPagina(t, d);
      return `<label class="chk${sel.has(k) ? " on" : ""}${mal ? " mal" : ""}" title="${mal ? "No cabe en la media hoja" : ""}"><input type="checkbox" data-k="${k}" ${sel.has(k) ? "checked" : ""}>${TIPOS[t].dias > 1 ? "D" + d : "Carta"}${d === hoyDe(t) && TIPOS[t].dias > 1 ? " · hoy" : ""}${n ? " •" : ""}${mal ? " ⚠" : ""}</label>`;
    }).join("")}</div>`).join("") + `<p class="nota">${sel.size} ${sel.size === 1 ? "hoja" : "hojas"} · • = con cambios · ⚠ = no cabe</p>`;
    $("dlg-ok").disabled = !sel.size;
  };
  $("dlg-cuerpo").onchange = e => { const k = e.target.dataset.k; if (!k) return; e.target.checked ? sel.add(k) : sel.delete(k); pintar(); };
  $("dlg-hoy").textContent = `Hoy: cena D${HOY_CENA} y almuerzo D${HOY_ALM}, con sus postres`;
  $("dlg-hoy").onclick = () => { sel = deHoy(); pintar(); };
  $("dlg-nada").onclick = () => { sel = new Set(); pintar(); };
  $("dlg-ok").onclick = () => {
    const lista = paginas().filter(k => sel.has(k));
    estado.imprimir = lista; guardar(); $("dlg-pdf").close(); imprimir(lista);
  };
  pintar(); $("dlg-pdf").showModal();
}
$("dlg-cerrar").onclick = () => $("dlg-pdf").close();
$("b-pdf").onclick = abrirDialogo;

function armarHojas(lista) {
  // Una hoja por menú, con el menú dos veces (se corta al medio), como los originales.
  $("impresion").innerHTML = lista.map(k => { const [t, d] = k.split("|"), m = menuHtml(t, d); return `<div class="hoja">${m}${m}</div>`; }).join("");
}
async function imprimir(lista) {
  const malas = lista.filter(k => desborda(...k.split("|")));
  if (malas.length && !confirm(`No caben en su media hoja: ${malas.map(k => rotulo(...k.split("|"))).join(", ")}.\n¿Imprimir igual?`)) return;
  armarHojas(lista);
  await document.fonts.ready;
  const f = new Date(), dd = String(f.getDate()).padStart(2, "0"), mm = String(f.getMonth() + 1).padStart(2, "0");
  const titulo = document.title;
  document.title = lista.length === 1 ? `Menú ${rotulo(...lista[0].split("|"))} ${dd}-${mm}` : `Menús ${dd}-${mm}`;   // nombre sugerido del PDF
  window.print();
  document.title = titulo;
}

// ── Respaldo ───────────────────────────────────────────────────────────────────
$("b-respaldo").onclick = () => {
  const b = new Blob([JSON.stringify(estado, null, 1)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(b);
  a.download = `menus-ata-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$("b-importar").onclick = () => $("f-importar").click();
$("f-importar").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const g = JSON.parse(await f.text());
    if (!g || g.v !== 1 || typeof g.ov !== "object") throw 0;
    if (!confirm("¿Reemplazar los cambios actuales por los del respaldo?")) return;
    const viejo = g.base !== BASE_VER;   // respaldo de antes de la cena nueva: sin sus cambios de cena
    estado = Object.assign({v: 1, ov: {}, manual: {}, pie: {}, imprimir: null}, g, {base: BASE_VER});
    if (viejo) for (const c of ["ov", "manual"]) for (const k of Object.keys(estado[c])) if (k.startsWith("cena|")) delete estado[c][k];
    for (const k in estado.ov) estado.ov[k] = (estado.ov[k] || []).map(limpio).filter(Boolean);
    guardar(); dibujarTodo(); avisar("Respaldo cargado");
  } catch (err) { avisar("Ese archivo no es un respaldo de Menús", true); }
};

// ── Arranque ───────────────────────────────────────────────────────────────────
// ?imprimir=cena|2,postresCena|2 deja armadas las hojas al cargar (sin abrir el
// diálogo): sirve para sacar el PDF por línea de comandos, como las notas de check-out.
const PEDIDO = new URLSearchParams(location.search).get("imprimir");
if (PEDIDO) armarHojas(PEDIDO.split(",").filter(k => paginas().includes(k)));
if (TIPOS[vista.tipo].dias < +vista.dia) vista.dia = "1";
dibujarTodo();
if (MIGRADO) avisar("La cena cambió a la carta de la app: se descartaron los cambios guardados sobre la cena anterior");
document.fonts.ready.then(() => { dibujarPapel(); if (!document.fonts.check('12px Objektiv')) avisar("Sin la fuente Objektiv: revisa la conexión", true); });
</script>
</body>
</html>
