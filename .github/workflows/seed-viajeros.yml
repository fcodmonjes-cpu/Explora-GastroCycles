name: Seed Viajeros (placeholder)

# Puebla /viajeros/current en Firebase con el seed placeholder del módulo
# Viajeros, mientras el Excel real (Dietas + Reporte Geos) no está disponible.
# Cuando llegue la fase 2, este workflow gana un cron horario como sync-rol.yml.
#
# Triggers:
#   · workflow_dispatch — botón "Run workflow" (visible en la UI de Actions
#     recién cuando este archivo llegue a main; la UI solo lista workflows
#     del branch default).
#   · push a staging/feature que toque el seed o este archivo — permite
#     re-sembrar desde QA sin pasar por main: editar SEED_ROWS y pushear.
on:
  workflow_dispatch:
  push:
    branches: [staging, 'feature/viajeros']
    paths:
      - 'scripts/sync_viajeros.py'
      - '.github/workflows/seed-viajeros.yml'

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests google-auth

      - name: Ejecutar seed
        run: python scripts/sync_viajeros.py --seed
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
