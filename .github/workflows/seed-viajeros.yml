name: Seed Viajeros (placeholder)

# Puebla /viajeros/current en Firebase con el seed placeholder del módulo
# Viajeros. Desde el 2026-07-30 la fuente real es sync-viajeros.yml (PGO), así
# que esto quedó como RESPALDO: solo se corre a mano, y pisa los datos del día
# con un roster viejo (SEED_ROWS). Usarlo únicamente si PGO está caído.
#
# SOLO workflow_dispatch. Antes también corría con `push` a staging/feature que
# tocara scripts/sync_viajeros.py — y el 2026-07-31 eso reventó producción: un
# merge a staging que traía cambios del script re-sembró el roster del 29 sobre
# los datos del 31. Firebase es una sola base de producción (ARCHITECTURE §4):
# ningún push debe escribirle sin que alguien lo pida.
on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests google-auth

      - name: Ejecutar seed
        run: python scripts/sync_viajeros.py --seed
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
