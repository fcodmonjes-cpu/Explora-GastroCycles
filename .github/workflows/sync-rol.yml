name: Sync Rol desde SharePoint

on:
  schedule:
    - cron: '0 * * * *'   # cada hora en punto
  workflow_dispatch:        # trigger manual desde GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install openpyxl requests google-auth

      - name: Ejecutar sync
        run: python scripts/sync_rol.py
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
