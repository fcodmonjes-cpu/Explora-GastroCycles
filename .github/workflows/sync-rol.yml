name: Sync Rol desde SharePoint

# DESHABILITADO 2026-08-01 — cayó en desuso: la base de la que extraía los
# datos cambió por completo y el job venía fallando cada hora. El overview de
# turnos ya salió de la home y el rol vivo se cubre desde PGO (sync-viajeros).
#
# Queda SOLO workflow_dispatch: no corre solo, pero se puede disparar a mano
# para probar si algún día se reconecta la fuente. Para revivirlo: arreglar
# scripts/sync_rol.py contra la fuente nueva, actualizar el secret
# SHAREPOINT_URL y descomentar el cron de abajo.

on:
  # schedule:
  #   - cron: '0 * * * *'   # cada hora en punto
  workflow_dispatch:        # trigger manual desde GitHub Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install openpyxl requests google-auth

      - name: Ejecutar sync
        run: python scripts/sync_rol.py
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
          SHAREPOINT_URL: ${{ secrets.SHAREPOINT_URL }}
