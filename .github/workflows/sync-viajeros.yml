name: Sync Viajeros (PGO)

# Fase 2: entra a PGO (portal web), lee el "Reporte Geos" + "Dietas" del día y
# escribe /viajeros/current en Firebase — el reemplazo automático del seed manual.
#
# Corre CADA 30 MINUTOS, todo el día. Antes corría una sola vez a medianoche de
# Chile, y eso perdía todos los check-in del día: un huésped que llegaba a las
# 14:00 no aparecía en el handbook hasta la madrugada siguiente, así que el
# garzón lo atendía sin ver sus alergias ni restricciones. Los minutos de
# Actions son gratis (repo público), así que el límite no es el costo: es no
# golpear de más el portal de PGO y que GitHub atrasa los cron bajo carga
# (5-20 min), atraso que a 30 min de intervalo todavía no domina.
# También corre a mano desde la UI de Actions.
#
# El cron pasa la fecha de HOY EN CHILE: PGO abre por defecto en el día
# siguiente, así que sin --date poblaría mañana. La zona horaria es esencial
# ahora que se corre a toda hora — ver la nota en el paso "Sync desde PGO".
# Ojo: GitHub atrasa los cron en horas de carga; si un día importa el minuto
# exacto, disparar a mano.
# Nota: el botón "Run workflow" recién aparece en la UI de Actions cuando este
# archivo llega a la rama default (main) — igual que seed-viajeros.yml.
#
# Secrets requeridos (Settings -> Secrets and variables -> Actions):
#   PGO_BASE_URL, PGO_USER, PGO_PASS, FIREBASE_KEY
# Opcionales para afinar sin tocar código (como "Variables" del repo/entorno):
#   PGO_LOGIN_PATH, PGO_SEL_USER, PGO_SEL_PASS, PGO_SEL_SUBMIT,
#   PGO_GEOS_PATH, PGO_DIETAS_PATH, PGO_TABLE_SEL, PGO_DATE_FMT

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Fecha del reporte (YYYY-MM-DD). Vacío = la que PGO trae por defecto (mañana)."
        required: false
        default: ""
      dump_html:
        description: "Diagnóstico: guarda el HTML de PGO como artifact (para ajustar selectores). No escribe Firebase."
        type: boolean
        default: false
      trace_net:
        description: "Diagnóstico: lista las llamadas XHR de la SPA (para descubrir la API interna). No escribe Firebase."
        type: boolean
        default: false
      dry_run:
        description: "Leer PGO y mostrar el resumen SIN escribir en Firebase."
        type: boolean
        default: false
      explore:
        description: "Calibración: perfila los reportes NUEVOS sin escribir nada. Vacío = no explorar. 'all' o 'arrival,birthday,comedor'."
        required: false
        default: ""

# Con 48 corridas al día y un job de varios minutos, el solape deja de ser
# hipotético: dos corridas escribiendo viajeros/current a la vez podrían dejar
# el doc mezclado. Se encolan en vez de cancelarse — cancelar a mitad de una
# escritura es justo lo que no se quiere.
concurrency:
  group: sync-viajeros
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Sin tope, una corrida colgada en el login de PGO ocupa el runner hasta el
    # límite de 6 horas de GitHub y se encima con decenas de corridas siguientes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install requests google-auth playwright
          python -m playwright install --with-deps chromium

      - name: Sync desde PGO
        env:
          PGO_BASE_URL: ${{ secrets.PGO_BASE_URL }}
          PGO_USER:     ${{ secrets.PGO_USER }}
          PGO_PASS:     ${{ secrets.PGO_PASS }}
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY }}
        run: |
          # --explore es un modo aparte: perfila los reportes nuevos y sale sin
          # construir el doc ni tocar Firebase. Corta antes de armar el resto de
          # los flags para que no se mezcle con el sync productivo.
          EXPLORE="${{ inputs.explore }}"
          if [ -n "$EXPLORE" ]; then
            ARGS="--explore"
            if [ "$EXPLORE" != "all" ]; then ARGS="$ARGS $EXPLORE"; fi
            if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
            if [ "${{ inputs.dump_html }}" = "true" ]; then ARGS="$ARGS --dump-html"; fi
            if [ "${{ inputs.trace_net }}" = "true" ]; then ARGS="$ARGS --trace-net"; fi
            echo "Ejecutando (calibración, no escribe): sync_viajeros.py $ARGS"
            python scripts/sync_viajeros.py $ARGS
            exit $?
          fi

          ARGS="--from-pgo"
          FECHA="${{ inputs.date }}"
          # En el cron no hay inputs: se usa la fecha de HOY EN CHILE.
          # La zona horaria NO es un detalle. Con `date -u +%F` esto andaba de
          # casualidad, porque la única corrida era a las 04:00 UTC = 00:00 en
          # Chile del mismo día. Corriendo cada 30 min, las corridas de la franja
          # 00:00-03:59 UTC caen a las 20:00-00:00 de Chile — plena cena — donde
          # el día UTC ya es el SIGUIENTE: habrían traído el roster de mañana.
          # Y la app no valida la fecha, sólo la muestra como etiqueta, así que
          # el error sería invisible. America/Santiago además absorbe solo el
          # cambio de horario de verano (UTC-4 en invierno, UTC-3 en verano).
          if [ -z "$FECHA" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            FECHA="$(TZ='America/Santiago' date +%F)"
          fi
          if [ -n "$FECHA" ]; then ARGS="$ARGS --date $FECHA"; fi
          if [ "${{ inputs.dump_html }}" = "true" ]; then ARGS="$ARGS --dump-html --debug"; fi
          if [ "${{ inputs.trace_net }}" = "true" ]; then ARGS="$ARGS --trace-net --debug"; fi
          if [ "${{ inputs.dry_run }}"   = "true" ]; then ARGS="$ARGS --debug"; fi
          echo "Ejecutando: sync_viajeros.py $ARGS"
          python scripts/sync_viajeros.py $ARGS

      # OJO: el HTML volcado contiene DATOS PERSONALES de huéspedes (nombres,
      # alergias). Retención mínima y sólo para depurar selectores.
      - name: Subir HTML de depuración
        if: ${{ always() && inputs.dump_html }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pgo-dump
          path: pgo-dump/
          retention-days: 1
          if-no-files-found: ignore
